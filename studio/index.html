<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergence Studio 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1efe6;color:#28332b;font:11px 'Courier New',monospace}button,input,select{font:inherit;color:inherit}button{background:transparent;border:1px solid #aab3a4;padding:8px;cursor:pointer}button:hover,button.active{background:#dce4d6}a{color:inherit}header,footer{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #aab3a4;flex-wrap:wrap}header strong{margin-right:auto}main{display:grid;grid-template-columns:220px minmax(0,1fr) 250px;height:calc(100dvh - 110px);min-height:450px}aside{padding:12px;overflow:auto;border-right:1px solid #aab3a4}aside:last-child{border-right:0;border-left:1px solid #aab3a4}h2{font-size:12px;font-weight:normal;border-bottom:1px solid #aab3a4;padding-bottom:10px}#map{position:relative;min-width:0;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}#readout{position:absolute;bottom:15px;left:15px;pointer-events:none}#atlas button{display:block;width:100%;text-align:left;margin:4px 0;border:0;border-bottom:1px solid #c5cabe}label.field{display:block;margin:12px 0}label.field input:not([type=checkbox]){width:100%;margin-top:5px}input[type=text],input[type=number]{background:transparent;border:1px solid #aab3a4;padding:6px}input[type=range]{accent-color:#788c79}fieldset{border:1px solid #aab3a4;margin:12px 0;padding:8px}fieldset label{display:block;margin:7px 0}footer{border-top:1px solid #aab3a4;border-bottom:0}#status{margin-left:auto}.output header,.output aside,.output footer,.output #readout{display:none}.output main{display:block;height:100dvh}.output #map{height:100%}@media(max-width:850px){main{grid-template-columns:150px minmax(0,1fr);height:auto}#map{height:65vh}aside:last-child{grid-column:1/-1;border-top:1px solid #aab3a4}header,footer{gap:5px}}
#projectPage{position:absolute;inset:0;background:#f1efe6;padding:8%;overflow:auto;z-index:5}#projectPage h1{font:normal clamp(25px,5vw,65px) Georgia,serif}#projectPage .symbol{font-size:clamp(60px,14vw,180px);color:var(--object-ink,#b35b51)}#projectPage p{max-width:45ch;line-height:1.6}#projectPage[hidden]{display:none}</style></head><body><header><strong>LF / EMERGENCE STUDIO 002</strong><a href="../concept/">CONCEPT ↗</a><button id="view">AXONOMETRIC</button><label>Elevation <input id="elevation" type="range" min="0" max="100" value="65"></label><label>Contours <input id="density" type="range" min="8" max="45" value="27"></label><label>Weight <input id="weight" type="range" min=".2" max="2" step=".1" value=".65"></label><label>Tilt <input id="tilt" type="range" min=".15" max=".8" step=".01" value=".46"></label><label>Theme <select id="theme"><option value="custom">Custom</option><option value="acid">01 / Acid</option><option value="red">02 / Red</option><option value="paper">03 / Paper</option><option value="night">04 / Nocturnal</option></select></label><label>Text <input id="text" type="color" value="#28332b"></label><label>Object <input id="objectInk" type="color" value="#b35b51"></label><label>Ink <input id="line" type="color" value="#80947c"></label><label>Paper <input id="paper" type="color" value="#f1efe6"></label></header><main><aside><h2>01 / PROJECT ATLAS</h2><button id="add">+ ADD</button> <button id="duplicate">DUPLICATE</button><div id="atlas"></div><h2>02 / LAYERS</h2><div id="filters"></div><button id="preview">PREVIEW PROJECT ↗</button></aside><div id="map"><canvas id="terrain"></canvas><div id="readout">CLICK TO ENTER / DRAG TO MOVE</div><article id="projectPage" hidden><button id="back">← BACK TO LANDSCAPE</button><div id="projectBody"></div></article></div><aside><h2>03 / INSPECTOR</h2><div id="inspector"></div></aside></main><footer><button id="save">SAVE LOCAL</button><button id="export">EXPORT JSON</button><button id="import">IMPORT JSON</button><input id="file" type="file" accept=".json" hidden><button id="output">OPEN OUTPUT ↗</button><button id="reset">RESTORE DEFAULT LANDSCAPE</button><span id="status">READY</span></footer><script>
let points=[
{title:'Tender',year:2024,group:'works',glyph:'◉',object:'fossil',x:.46,y:.17,peak:1.05,r:.10},
{title:'Walking and Falling',year:2025,group:'works',glyph:'✳',object:'skeleton',x:.78,y:.18,peak:.91,r:.09},
{title:'La medusa è un ispessimento dell’acqua',year:2025,group:'collab',glyph:'✺',object:'jellyfish',x:.52,y:.35,peak:.83,r:.085},
{title:'INLANDS',year:2024,group:'works',glyph:'◌',object:'stones and clay',x:.23,y:.47,peak:.80,r:.09},
{title:'ABUNDANCE',year:2024,group:'works',glyph:'✴',object:'shell',x:.76,y:.44,peak:1.15,r:.105},
{title:'I AM ABUNDANCE',year:2025,group:'works',glyph:'✷',object:'mirror',x:.77,y:.68,peak:.85,r:.09},
{title:'Sparizione',year:2023,group:'works',glyph:'▤',object:'sideboard',x:.12,y:.63,peak:.95,r:.09},
{title:'SIGILLO',year:2022,group:'works',glyph:'◇',object:'glass fragment',x:.12,y:.33,peak:.78,r:.085},
{title:'Luccichio',year:2024,group:'curatorial',glyph:'❋',object:'vegetation',x:.20,y:.15,peak:.93,r:.09},
{title:'Archive of the Untamed — Deep Data Foraging',year:2024,group:'curatorial',glyph:'⌖',object:'map fragment',x:.19,y:.27,peak:.69,r:.075},
{title:'EXIT_V',year:2022,group:'curatorial',glyph:'⌘',object:'knot',x:.31,y:.61,peak:.87,r:.09},
{title:'SSSST...',year:2022,group:'curatorial',glyph:'▧',object:'zine',x:.45,y:.76,peak:.86,r:.09},
{title:'Only Stones Can Keep Secrets',year:2024,group:'curatorial',glyph:'⬡',object:'stone',x:.58,y:.56,peak:.75,r:.09},
{title:'Clessidra',year:2023,group:'collab',glyph:'⌛',object:'hourglass',x:.88,y:.36,peak:.82,r:.085}
];
const defaults=JSON.stringify(points),layers={works:'Selected works',curatorial:'Curatorial practices',collab:'Collaborations'},areas=['Landscape','Body','DIY / DIT','Feminism'];const output=new URLSearchParams(location.search).has('output');if(output)document.body.classList.add('output');
let entering=false,transitionId=0;let settings={density:27,weight:.65,tilt:.46,line:'#80947c',paper:'#f1efe6',text:'#28332b',objectInk:'#b35b51'},selected=0,projectionScale=1,drag=null;
points.forEach(p=>{p.groups=[p.group];p.areas=[];p.size=25});points[2].groups=['works','collab'];
const canvas=document.querySelector('#terrain'),ctx=canvas.getContext('2d');const box=document.querySelector('#map'),readout=document.querySelector('#readout');
const active={works:true,curatorial:true,collab:true},amp=points.map(()=>1),target=points.map(()=>1);
let orientation=1,blend=1,elevation=.65,dirty=true,hits=[],last=0;
function heightField(x,y){let v=0;points.forEach((p,i)=>{const dx=x-p.x,dy=y-p.y,r2=dx*dx+dy*dy,r=p.r*p.r;v+=amp[i]*p.peak*(.87*Math.exp(-r2/(r*.56))+.13*Math.exp(-r2/(r*3.2)))});return v}
function draw(timestamp){
  requestAnimationFrame(draw);if(timestamp-last<28)return;last=timestamp;
  amp.forEach((v,i)=>{const d=target[i]-v;if(Math.abs(d)>.002){amp[i]+=d*.13;dirty=true}else if(d!==0){amp[i]=target[i];dirty=true}});
  if(Math.abs(blend-orientation)>.002){blend+=(orientation-blend)*.13;dirty=true}else blend=orientation;
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(!w||!h)return;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);dirty=true}
  if(!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle=settings.paper;ctx.fillRect(0,0,w,h);
  const scale=Math.min(w*.46,h*.76); projectionScale=scale;
  function project(x,y,z){const a=[w/2+(x-y)*scale,h*.44+(x+y-1)*scale*settings.tilt-z*elevation*scale*.43],b=[w/2+(x-.5)*scale*1.35,h*.45+(y-.5)*scale*1.35];return [b[0]+(a[0]-b[0])*blend,b[1]+(a[1]-b[1])*blend]}
  const n=65,grid=new Float32Array((n+1)*(n+1)),step=1/n;
  for(let yy=0;yy<=n;yy++)for(let xx=0;xx<=n;xx++)grid[yy*(n+1)+xx]=heightField(xx*step,yy*step);
  const at=(x,y)=>grid[y*(n+1)+x];
  for(let k=1;k<=settings.density;k++){
    const level=k*3.1/settings.density;ctx.beginPath();
    for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++){
      const c=[[xx*step,yy*step,at(xx,yy)],[(xx+1)*step,yy*step,at(xx+1,yy)],[(xx+1)*step,(yy+1)*step,at(xx+1,yy+1)],[xx*step,(yy+1)*step,at(xx,yy+1)]],cross=[];
      for(let edge=0;edge<4;edge++){const a=c[edge],b=c[(edge+1)%4];if((a[2]<level)!==(b[2]<level)){const t=(level-a[2])/(b[2]-a[2]);cross.push(project(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,level))}}
      for(let t=0;t+1<cross.length;t+=2){ctx.moveTo(cross[t][0],cross[t][1]);ctx.lineTo(cross[t+1][0],cross[t+1][1])}
    }
    ctx.lineWidth=settings.weight*(k%5===0?1.5:1);ctx.strokeStyle=settings.line;ctx.stroke();
  }
  hits=[];
  points.map((p,i)=>({p,i})).sort((a,b)=>a.p.x+a.p.y-b.p.x-b.p.y).forEach(o=>{
    const p=o.p;if(amp[o.i]<.08)return;
    const z=heightField(p.x,p.y),[x,y]=project(p.x,p.y,z);
    ctx.globalAlpha=Math.min(1,amp[o.i]*1.3);
    ctx.strokeStyle=settings.objectInk;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-17);ctx.stroke();ctx.fillStyle=settings.objectInk;ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();
    ctx.textAlign='center';ctx.font=(p.size||25)+'px Georgia, serif';ctx.fillText(p.glyph,x,y-19);
    const label=p.title.length>23?p.title.slice(0,22)+'…':p.title;ctx.font='10px monospace';const tw=ctx.measureText(label).width;ctx.fillStyle=settings.paper;ctx.fillRect(x-tw/2-3,y-14,tw+6,13);ctx.fillStyle=settings.text;ctx.fillText(label,x,y-4);
    hits.push({x,y:y-18,p,i:o.i});if(o.i===selected&&!output){ctx.strokeStyle=settings.objectInk;ctx.strokeRect(x-19,y-43,38,30)};
  });ctx.globalAlpha=1;
}

const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sync(){amp.length=points.length;target.length=points.length;points.forEach((p,i)=>{target[i]=p.groups.some(g=>active[g])?(Object.values(active).every(Boolean)?1:1.55):.06;if(!Number.isFinite(amp[i]))amp[i]=target[i]});dirty=true}
function select(i){selected=i;refresh();dirty=true}
function refresh(){const atlas=$('atlas');atlas.replaceChildren();points.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.glyph+' '+p.title;b.className=i===selected?'active':'';b.onclick=()=>select(i);atlas.append(b)});const root=$('inspector');root.replaceChildren();const p=points[selected];if(!p)return;
function field(key,label,type,min,max,step){const l=document.createElement('label');l.className='field';l.textContent=label;const input=document.createElement('input');input.type=type;input.value=p[key];if(min!==undefined){input.min=min;input.max=max;input.step=step}input.dataset.key=key;input.oninput=()=>{p[key]=type==='text'?input.value:Number(input.value);if(key==='title'||key==='glyph')atlas.children[selected].textContent=p.glyph+' '+p.title;dirty=true};l.append(input);root.append(l)}
field('title','Project title','text');field('object','Object','text');field('glyph','Symbol','text');field('x','X position','range',.02,.98,.005);field('y','Y position','range',.02,.98,.005);field('peak','Altitude','range',.05,2,.01);field('r','Influence radius','range',.025,.3,.005);field('size','Object size','range',10,75,1);
for(const [key,items] of [['groups',Object.entries(layers)],['areas',areas.map(a=>[a,a])]]){const f=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=key;f.append(legend);items.forEach(([v,label])=>{const l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.checked=p[key].includes(v);b.onchange=()=>{p[key]=b.checked?[...p[key],v]:p[key].filter(x=>x!==v);sync()};l.append(b,document.createTextNode(label));f.append(l)});root.append(f)}
const del=document.createElement('button');del.textContent='DELETE PROJECT';del.onclick=()=>{if(confirm('Delete '+p.title+'?')){points.splice(selected,1);amp.splice(selected,1);target.splice(selected,1);selected=Math.max(0,selected-1);sync();refresh()}};root.append(del)}
const allButton=document.createElement('button');allButton.textContent='ALL PROJECTS';$('filters').append(allButton);allButton.onclick=()=>{Object.keys(active).forEach(g=>active[g]=true);paintFilters();sync()};function paintFilters(){allButton.classList.toggle('active',Object.values(active).every(Boolean));Object.keys(active).forEach((g,i)=>$('filters').children[i+1].classList.toggle('active',active[g]))}Object.entries(layers).forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{Object.keys(active).forEach(g=>active[g]=g===k);paintFilters();sync()};$('filters').append(b)});
$('add').onclick=()=>{points.push({title:'New project',object:'Object',glyph:'◇',x:.5,y:.5,peak:.8,r:.09,size:25,groups:['works'],areas:[]});sync();select(points.length-1)};
$('duplicate').onclick=()=>{if(!points[selected])return;const p=JSON.parse(JSON.stringify(points[selected]));p.title+=' copy';p.x=clamp(p.x+.04,.02,.98);points.push(p);sync();select(points.length-1)};
$('view').onclick=()=>{orientation=orientation?0:1;$('view').textContent=orientation?'AXONOMETRIC':'PLAN VIEW';dirty=true};$('elevation').oninput=e=>{elevation=Number(e.target.value)/100;dirty=true};const themes={acid:['#c8ff24','#e52d26','#972019','#e52d26'],red:['#e52d26','#c8ff24','#c8ff24','#c8ff24'],paper:['#f1efe6','#e52d26','#28332b','#e52d26'],night:['#171717','#c8ff24','#c8ff24','#c8ff24']};function applyColors(){const page=$('projectPage');page.style.background=settings.paper;page.style.color=settings.text;page.style.setProperty('--object-ink',settings.objectInk);const match=Object.keys(themes).find(k=>themes[k].every((v,i)=>v.toLowerCase()===settings[['paper','line','text','objectInk'][i]].toLowerCase()));$('theme').value=match||'custom';dirty=true}Object.keys(settings).forEach(k=>$(k).oninput=e=>{settings[k]=e.target.type==='color'?e.target.value:Number(e.target.value);applyColors()});$('theme').onchange=e=>{const t=themes[e.target.value];if(!t)return;['paper','line','text','objectInk'].forEach((k,i)=>{$(k).value=settings[k]=t[i]});applyColors()};
canvas.onpointerdown=e=>{if(entering)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let hit=hits.reduce((best,h)=>Math.hypot(h.x-x,h.y-y)<Math.hypot((best?.x??1e6)-x,(best?.y??1e6)-y)?h:best,null);if(hit&&Math.hypot(hit.x-x,hit.y-y)<35){select(hit.i);drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)}};
canvas.onpointermove=e=>{if(!drag||output)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<5)return;drag.moved=true;const p=points[selected],dx=(e.clientX-drag.x)/projectionScale,dy=(e.clientY-drag.y)/projectionScale;const a=1.35*(1-blend)+blend,b=-blend,c=settings.tilt*blend,d=1.35*(1-blend)+settings.tilt*blend,det=a*d-b*c;p.x=clamp(p.x+(d*dx-b*dy)/det,.02,.98);p.y=clamp(p.y+(-c*dx+a*dy)/det,.02,.98);drag.x=e.clientX;drag.y=e.clientY;$('inspector').querySelector('[data-key=x]').value=p.x;$('inspector').querySelector('[data-key=y]').value=p.y;dirty=true};canvas.onpointerup=()=>{const click=drag&&!drag.moved;drag=null;if(click)enterProject(selected)};canvas.onpointercancel=()=>{drag=null};
function enterProject(i){if(entering||!points[i])return;entering=true;const token=++transitionId,p=points[i];target.forEach((_,j)=>target[j]=j===i?2.5:0);dirty=true;setTimeout(()=>{if(token!==transitionId)return;target.fill(0);dirty=true},950);setTimeout(()=>{if(token!==transitionId)return;const body=$('projectBody');body.replaceChildren();const meta=document.createElement('p');meta.textContent=p.year+' / '+p.groups.map(g=>layers[g]).join(' / ');const title=document.createElement('h1');title.textContent=p.title;const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=p.glyph;const desc=document.createElement('p');desc.textContent='Project page prototype — '+p.object;body.append(meta,title,symbol,desc);$('projectPage').hidden=false},2050)}$('preview').onclick=()=>enterProject(selected);$('back').onclick=()=>{transitionId++;entering=false;$('projectPage').hidden=true;sync()};function snapshot(){return {version:2,points,settings,elevation,orientation,active}}
function load(v){if(!v||!Array.isArray(v.points)||v.points.length>100||!v.points.every(p=>typeof p.title==='string'&&['x','y','peak','r'].every(k=>Number.isFinite(p[k]))&&p.r>0))throw Error('Invalid project JSON');points=v.points.map(p=>({...p,groups:Array.isArray(p.groups)?p.groups:[p.group||'works'],areas:Array.isArray(p.areas)?p.areas:[],size:p.size||25}));for(const k of Object.keys(settings)){if(v.settings?.[k]!==undefined)settings[k]=v.settings[k];$(k).value=settings[k]}elevation=Number.isFinite(v.elevation)?v.elevation:.65;orientation=v.orientation===0?0:1;$('elevation').value=elevation*100;$('view').textContent=orientation?'AXONOMETRIC':'PLAN VIEW';Object.keys(active).forEach(k=>{active[k]=v.active?.[k]!==false});paintFilters();selected=0;applyColors();sync();refresh()}
function save(){try{localStorage.setItem('emergence-studio-v2',JSON.stringify(snapshot()));$('status').textContent='SAVED IN THIS BROWSER';return true}catch(e){$('status').textContent=e.message;return false}}
$('save').onclick=save;$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='emergence-landscape.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()));$('status').textContent='IMPORTED'}catch(err){$('status').textContent=err.message}e.target.value=''};$('output').onclick=()=>{if(save())window.open('?output=1','emergence-output')};$('reset').onclick=()=>{if(confirm('Restore the original portfolio landscape?')){transitionId++;entering=false;$('projectPage').hidden=true;load({points:JSON.parse(defaults).map((p,i)=>({...p,groups:i===2?['works','collab']:[p.group],areas:[],size:25})),settings:{density:27,weight:.65,tilt:.46,line:'#80947c',paper:'#f1efe6'},elevation:.65,orientation:1,active:{works:true,curatorial:true,collab:true}});save();$('status').textContent='ORIGINAL LANDSCAPE RESTORED'}};
try{const saved=localStorage.getItem('emergence-studio-v2');if(saved)load(JSON.parse(saved))}catch(e){$('status').textContent=e.message}window.addEventListener('storage',e=>{if(output&&e.key==='emergence-studio-v2'&&e.newValue)load(JSON.parse(e.newValue))});applyColors();paintFilters();sync();refresh();requestAnimationFrame(draw);
</script></body></html>
